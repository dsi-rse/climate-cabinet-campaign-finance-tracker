name: Development Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  # weekly run against upgraded dependencies (see Install Dependencies), so a
  # breaking release is caught before the next relock. GitHub runs schedules
  # against the default branch only.
  schedule:
    - cron: "0 13 * * 1"

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          # keep in sync with the uv version in the Dockerfile
          version: "0.13.7"
          enable-cache: true
      - name: Install Dependencies
        run: |
          # The weekly run tests the newest versions uv.lock allows, without
          # committing them, so upstream breakage shows up before anyone
          # relocks. Every other run installs exactly what uv.lock pins.
          # Python comes from .python-version; the project is installed
          # editable, so tests and coverage run against src/.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv lock --upgrade
            uv sync
          else
            uv sync --locked
          fi
      - name: Lint with pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Run Pytest
        run: |
          # coverage run on pytest. If pytest fails, workflow exits in failure
          uv run coverage run -m pytest --doctest-modules
          uv run coverage json
          export TOTAL=$(uv run python -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "total=$TOTAL" >> $GITHUB_ENV
          uv run coverage report -m --format=markdown >> temp.md
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          {
            echo 'REPORT<<EOF'
            cat temp.md
            echo EOF
          } >> "$GITHUB_ENV"
          echo "report=$REPORT" >> $GITHUB_ENV
      - name: Report Coverage
        uses: actions/github-script@v7
        env:
          # source coverage was 58% when this floor was set; raise it as tests are added
          min_coverage: 55
        with:
          script: |
            // only pull requests have an issue to comment on; push, schedule
            // and manual runs still enforce min_coverage below
            if (context.eventName === "pull_request") {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `${{ env.REPORT }}`
              })
            }
            if ( ${{ env.total }} <= ${{ env.min_coverage }} ) { 
              console.log(
                "Coverage test failed as code coverage is ${{ env.total }}% and the minimum is ${{ env.min_coverage}}%"
              )
              process.exitCode = 1 
            }
