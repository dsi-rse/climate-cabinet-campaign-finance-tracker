name: Development Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  # weekly run so a new release of an unpinned dependency that breaks the
  # build is caught even when no one is pushing. GitHub runs schedules
  # against the default branch only.
  schedule:
    - cron: "0 13 * * 1"

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.0
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # editable so tests and coverage run against src/, not a site-packages copy
          pip install -e .
      - name: Lint with pre-commit
        uses: pre-commit/action@v3.0.0
      - name: Run Pytest
        run: |
          # coverage run on pytest. If pytest fails, workflow exits in failure
          coverage run -m pytest --doctest-modules
          coverage json
          export TOTAL=$(python -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "total=$TOTAL" >> $GITHUB_ENV
          coverage report -m --format=markdown >> temp.md
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          {
            echo 'REPORT<<EOF'
            cat temp.md
            echo EOF
          } >> "$GITHUB_ENV"
          echo "report=$REPORT" >> $GITHUB_ENV
      - name: Report Coverage
        uses: actions/github-script@v7
        env:
          # source coverage was 58% when this floor was set; raise it as tests are added
          min_coverage: 55
        with:
          script: |
            // only pull requests have an issue to comment on; push, schedule
            // and manual runs still enforce min_coverage below
            if (context.eventName === "pull_request") {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `${{ env.REPORT }}`
              })
            }
            if ( ${{ env.total }} <= ${{ env.min_coverage }} ) { 
              console.log(
                "Coverage test failed as code coverage is ${{ env.total }}% and the minimum is ${{ env.min_coverage}}%"
              )
              process.exitCode = 1 
            }
