Transactor:
# whether to make Transactor a 'parent' table that Individual and Organization
# inherit from was a difficult design decision.
# sources: https://stackoverflow.com/a/695860
  child_tables:
    - Individual
    - Organization
  required_attributes:
    - id
    # - transactor_type # Indivudual or Organization

  attributes:
    - id
    - full_name
    - transactor_type_specific
    - transactor_type # Indivudual or Organization
    - phone_number
    - email
    - party
    - reported_state
  enum_columns:
    transactor_type:
      - Individual
      - Organization
    transactor_type_specific:
      - Lobbyist
      - Candidate
      - Vendor
      - Corporation
      - Non-profit
      - Committee
      - Party
      - Caucus
    party:
      - Republican
      - Democrat
      - Independent
      - Other
      - Green
      - Libertarian
      - Constitution
      - Reform  
  relations:
    - prefix: address
      table: Address
      direction: reverse
      reverse_relation_name: transactor_id
    

Individual:
  parent_table: Transactor
  attributes:
    - first_name
    - middle_name
    - last_name
    - name_suffix
    - name_prefix
    - name_preferred
    - occupation
  relations:
    - prefix: employer
      table: Membership
      direction: reverse
      reverse_relation_name: member_id
      relationship_column_values:
        membership_type: Employee
    - prefix: election_result
      table: ElectionResult
      direction: reverse
      reverse_relation_name: candidate_id

Organization:
  parent_table: Transactor
  attributes:
    - naics
    - sic
    - stock_symbol
    - ein
  # forward_relations:
  #   parent_org: Organization
  relations:
    - prefix: candidate
      table: Membership
      direction: reverse
      reverse_relation_name: organization_id
      relationship_column_values:
        membership_type: Candidate
    - prefix: treasurer
      table: Membership
      direction: reverse
      reverse_relation_name: organization_id
      relationship_column_values:
        membership_type: Treasurer
    - prefix: chairman
      table: Membership
      direction: reverse
      reverse_relation_name: organization_id
      relationship_column_values:
        membership_type: Chairman
    - prefix: sponsor
      table: Membership
      direction: reverse
      reverse_relation_name: organization_id
      relationship_column_values:
        membership_type: Sponsor
    - prefix: designee
      table: Membership
      direction: reverse
      reverse_relation_name: organization_id
      relationship_column_values:
        membership_type: Designee


Transaction:
  required_attributes:
    - amount
    - donor_id
    - recipient_id
    # - year
    # - state
  attributes:
    - amount
    - date
    - year
    - month
    - day
    - transaction_type
    - description
    - reported_election_year
    - donor_id
    - recipient_id
    - reported_state
    - affected_party_id
    - influence_type
    # where the row came from: the state's own id for the row (only mapped
    # where the state gives one that is unique per row: TX and the AZ Access
    # export), the raw file relative to the state's data directory, and the
    # row's record number in that file, starting at 1 after any header and
    # counting blank and malformed lines
    # (PA rows that list up to three contributions give each the same row)
    - source_identifier
    - source_file
    - source_row
  relations:
    - prefix: donor
      table: Transactor
      direction: forward
    - prefix: recipient
      table: Transactor
      direction: forward
    - prefix: affected_party
      table: Transactor
      direction: forward
  enum_columns:
    transaction_type:
      - contribution
      - expenditure
      - independent_expenditure
    influence_type:
      - positive
      - negative
      - neutral
  types:
    # Float32 kept only 7 digits ($12,345,678.91 became $12,345,679). This is
    # Float64 rounded to cents in pandas and DECIMAL(18,2) in DuckDB
    amount: decimal(18,2)
    date: datetime64[ns]
    reported_election_year: Int32
    year: Int32
    day: Int32
    source_row: Int64

Election:
  required_attributes:
    - office_sought
  attributes:
    - id
    - year
    - district
    - office_sought
    - state
    - reported_state
  enum_columns:
    office_sought:
      - Governor
      - Lieutenant Governor
      - Secretary of State
      - Attorney General
      - Auditor General
      - State Treasurer
      - State Representative
      - State Senator
      - Supreme Court Justice
      - Judge
      - Mayor
      - District Attorney
      - Misc. City
      - Misc. State
      - City Council
  types:
    year: Int32

ElectionResult:
  required_attributes:
    - candidate_id
    - election_id
  attributes:
    - id
    - votes_received
    - win
    - candidate_id
    - election_id
    - reported_state
  relations:
    - prefix: candidate
      table: Individual
      direction: forward
    - prefix: election
      table: Election
      direction: forward
  types:
    votes_received: Int32
    win: bool
    
Address:
  required_attributes:
    - transactor_id
  attributes:
    - recipient
    - full_address 
    - line_1
    - building_number
    - building_name
    - street_predirectional
    - street_pre_type # i.e. highway, county road, etc.
    - street_name
    - street_post_type # i.e Ave., St., Rd., ...
    - street_postdirectional
    - po_box
    - line_2
    - secondary_address_identifier # i.e. Apt, Room, ...
    - secondary_address_number # i.e. 257G in Room 257G
    - city
    - state
    - zipcode
    - county
    - country
    - earliest_known_date
    - latest_known_date
    - known_later_address
    - transactor_id
    - reported_state
  relations:
    - prefix: transactor
      table: Transactor
      direction: forward

Membership:
  required_attributes:
    - member_id
    - organization_id
  attributes:
    - membership_type
    - role
    - description
    - earliest_known_date
    - latest_known_date
    - known_later_employer # for memberhship type employee
    - member_id
    - organization_id
    - reported_state
  relations:
    - prefix: member
      table: Individual
      direction: forward
    - prefix: organization
      table: Organization
      direction: forward
  enum_columns:
    membership_type:
      - Employee
      - Member
      - Treasurer
      - Chairman
      - Candidate
      - Designee
      - Sponsor
      - Other
